<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>승강기 통합 관리 시스템 - 에프엠엘지엘리베이터㈜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .tab-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="pb-28">

    <script>
        // 여기에 구글 앱스 스크립트 웹 앱 URL을 입력해주세요.
        const GOOGLE_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbwVOB_nh6A3SySPKjrq_i07MAWmeQyByiYOucVEr3S3FexSHd4GNk2GVjiE8MgpaHil/exec";
    </script>

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold flex items-center gap-2">
                    <i class="fa-solid fa-elevator text-blue-400"></i> 에프엠엘지엘리베이터㈜
                </h1>
                <p class="text-xs text-slate-300">승강기 통합 관리 시스템</p>
            </div>
            <div>
                <a href="risk.html" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved"></i> 위험성평가·TBM 바로가기
                </a>
            </div>
        </div>

        <nav class="flex bg-slate-800 text-slate-300 text-xs border-t border-slate-700 overflow-x-auto">
            <button onclick="switchTab('register')" id="tab-register" class="tab-btn active flex-1 py-2 text-center min-w-[50px] shrink-0"><i class="fa-solid fa-triangle-exclamation block text-sm mb-0.5 text-amber-400"></i> 1. 고장·하자 접수</button>
            <button onclick="switchTab('list')" id="tab-list" class="tab-btn flex-1 py-2 text-center min-w-[50px] shrink-0"><i class="fa-solid fa-list-check block text-sm mb-0.5"></i> 2. 접수 및 처리이력</button>
            <button onclick="switchTab('contacts')" id="tab-contacts" class="tab-btn flex-1 py-2 text-center min-w-[50px] shrink-0"><i class="fa-solid fa-address-book block text-sm mb-0.5 text-emerald-400"></i> 3. 비상연락망</button>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-4">

        <!-- TAB 1: 고장수리 및 하자접수 등록 -->
        <section id="sec-register" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b pb-3">
                    <i class="fa-solid fa-file-pen text-amber-500"></i> 승강기 고장수리 및 하자 접수 등록
                </h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="block text-slate-600 font-bold mb-1">현장명</label>
                        <input type="text" id="reg-site" value="에스스퀘어" class="w-full border rounded-lg p-2.5 bg-slate-50 font-medium">
                    </div>
                    <div>
                        <label class="block text-slate-600 font-bold mb-1 text-blue-600">승강기 호기 (예: 1호기)</label>
                        <input type="text" id="reg-elevator" value="1호기" class="w-full border rounded-lg p-2.5 bg-blue-50 font-bold text-blue-900">
                    </div>
                    <div>
                        <label class="block text-slate-600 font-bold mb-1">접수 일자</label>
                        <input type="date" id="reg-date" class="w-full border rounded-lg p-2.5 bg-slate-50 font-medium">
                    </div>
                    <div>
                        <label class="block text-slate-600 font-bold mb-1">업무 구분</label>
                        <select id="reg-type" class="w-full border rounded-lg p-2.5 bg-amber-50 font-bold text-amber-900">
                            <option value="고장수리접수">🚨 고장수리 및 긴급출동 접수</option>
                            <option value="하자접수">🛠️ 하자보수 접수</option>
                            <option value="일반점검">📋 일반 정기/수시 점검</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-slate-600 font-bold mb-1">접수자 / 담당자 성명</label>
                        <input type="text" id="reg-author" value="홍길동 (부장)" class="w-full border rounded-lg p-2.5 bg-slate-50 font-medium">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-slate-600 font-bold mb-1">고장 내용 또는 하자 접수 상세 내용</label>
                        <textarea id="reg-content" placeholder="고장 증상 및 현장 특이사항을 입력하세요" class="w-full border rounded-lg p-2.5 bg-slate-50 h-24 font-medium"></textarea>
                    </div>
                </div>

                <button onclick="saveIntegrationRecord()" class="w-full bg-slate-900 hover:bg-black text-white font-bold text-xs py-3 rounded-xl shadow">
                    <i class="fa-solid fa-cloud-arrow-up text-amber-400"></i> 접수 내용 저장 및 구글시트 전송
                </button>
            </div>
        </section>

        <!-- TAB 2: 접수 및 처리이력 조회 -->
        <section id="sec-list" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5"><i class="fa-solid fa-magnifying-glass text-blue-600"></i> 고장·하자 접수 이력 검색</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <input type="text" id="search-keyword" oninput="renderIntegrationList()" placeholder="현장명 또는 호기 검색 (예: 1호기)" class="border rounded-lg p-2.5 bg-slate-50">
                    <input type="date" id="search-date-filter" oninput="renderIntegrationList()" class="border rounded-lg p-2.5 bg-slate-50">
                </div>
            </div>
            <div id="integration-list-container" class="space-y-3"></div>
        </section>

        <!-- TAB 3: 비상연락망 -->
        <section id="sec-contacts" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3 shadow-sm">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 text-emerald-600 border-b pb-2">
                    <i class="fa-solid fa-address-book"></i> 임직원 및 협력사 비상연락망 관리
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
                    <input type="text" id="contact-name" placeholder="이름" class="border rounded-lg p-2 bg-slate-50">
                    <input type="text" id="contact-dept" placeholder="소속/부서" class="border rounded-lg p-2 bg-slate-50">
                    <input type="text" id="contact-phone" placeholder="전화번호" class="border rounded-lg p-2 bg-slate-50">
                    <input type="text" id="contact-role" placeholder="직급/역할" class="border rounded-lg p-2 bg-slate-50">
                </div>
                <button onclick="addEmergencyContact()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-lg shadow">비상연락망 등록</button>
            </div>
            <div class="bg-white p-4 rounded-xl border space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-list text-slate-700"></i> 비상연락망 목록</h3>
                    <input type="text" id="contact-search" oninput="renderEmergencyContacts()" placeholder="이름/부서 검색" class="border rounded px-2 py-1 text-xs bg-slate-50 w-48">
                </div>
                <div id="contacts-list" class="space-y-2"></div>
            </div>
        </section>

    </main>

    <script>
        const db = new Dexie('ElevatorIntegrationDB_v3');
        db.version(1).stores({
            records: '++id, siteName, elevatorNo, workDate, workType, author, content, createdAt',
            contacts: '++id, name, dept, phone, role'
        });

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('reg-date').value = new Date().toISOString().split('T')[0];
            renderIntegrationList();
            renderEmergencyContacts();
        });

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'list') renderIntegrationList();
            if (tab === 'contacts') renderEmergencyContacts();
        }

        async function saveIntegrationRecord() {
            const siteName = document.getElementById('reg-site').value;
            const elevatorNo = document.getElementById('reg-elevator').value;
            const workDate = document.getElementById('reg-date').value;
            const workType = document.getElementById('reg-type').value;
            const author = document.getElementById('reg-author').value;
            const content = document.getElementById('reg-content').value;

            if (!siteName || !elevatorNo) {
                alert("현장명과 승강기 호기를 입력해주세요.");
                return;
            }

            const payload = {
                id: 'record_' + Date.now(),
                type: workType,
                siteName,
                elevatorNo,
                workDate,
                author,
                notes: content,
                createdAt: new Date().toISOString()
            };

            await db.records.add(payload);

            if (!GOOGLE_SCRIPT_API_URL.includes("여기에_구글_웹앱_URL을_입력하세요")) {
                try {
                    await fetch(GOOGLE_SCRIPT_API_URL, {
                        method: "POST", mode: "no-cors",
                        body: JSON.stringify({ type: 'riskReport', payload })
                    });
                } catch(e) { console.error(e); }
            }

            alert("✅ 고장·하자 접수 내용이 저장되고 구글 시트로 전송되었습니다!");
            document.getElementById('reg-content').value = '';
            switchTab('list');
        }

        async function renderIntegrationList() {
            const container = document.getElementById('integration-list-container');
            if (!container) return;
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const dateFilter = document.getElementById('search-date-filter').value;

            let records = await db.records.reverse().toArray();

            let filtered = records.filter(r => {
                let matchKeyword = !keyword || (r.siteName && r.siteName.toLowerCase().includes(keyword)) || (r.elevatorNo && r.elevatorNo.toLowerCase().includes(keyword));
                let matchDate = !dateFilter || r.workDate === dateFilter;
                return matchKeyword && matchDate;
            });

            container.innerHTML = filtered.map(r => `
                <div class="bg-white p-4 rounded-xl border text-xs space-y-2 shadow-sm">
                    <div class="font-bold text-slate-800 flex justify-between items-center border-b pb-1.5">
                        <span class="text-blue-700 text-sm">${r.siteName} (${r.elevatorNo})</span>
                        <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">${r.type}</span>
                    </div>
                    <div class="text-slate-600 whitespace-pre-wrap">${r.notes || '내용 없음'}</div>
                    <div class="text-[11px] text-slate-400 flex justify-between pt-1 border-t">
                        <span>접수자: ${r.author}</span>
                        <span>접수일자: ${r.workDate}</span>
                    </div>
                </div>
            `).join('') || '<div class="text-center text-xs text-slate-400 py-6">등록된 접수 이력이 없습니다.</div>';
        }

        async function renderEmergencyContacts() {
            const container = document.getElementById('contacts-list');
            if (!container) return;
            let contacts = await db.contacts.toArray();
            container.innerHTML = contacts.map(c => `
                <div class="p-3 border rounded-xl bg-slate-50 text-xs font-bold flex justify-between items-center">
                    <div>${c.name} (${c.dept || '소속없음'}) - <span class="text-blue-600">${c.phone}</span></div>
                    <div class="text-slate-500 font-normal">${c.role || ''}</div>
                </div>
            `).join('') || '<div class="text-center text-xs text-slate-400 py-4">등록된 비상연락망이 없습니다.</div>';
        }

        async function addEmergencyContact() {
            const name = document.getElementById('contact-name').value;
            const dept = document.getElementById('contact-dept').value;
            const phone = document.getElementById('contact-phone').value;
            const role = document.getElementById('contact-role').value;
            if (name && phone) { 
                await db.contacts.add({ name, dept, phone, role }); 
                document.getElementById('contact-name').value = '';
                document.getElementById('contact-dept').value = '';
                document.getElementById('contact-phone').value = '';
                document.getElementById('contact-role').value = '';
                renderEmergencyContacts(); 
                alert("비상연락망이 등록되었습니다."); 
            } else {
                alert("이름과 전화번호를 입력해주세요.");
            }
        }
    </script>
</body>
</html>
