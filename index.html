<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>위험성 평가 & TBM 스마트 앱 - 에프엠엘지엘리베이터㈜</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Dexie.js for Offline IndexedDB -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- Signature Pad for Touch Signatures -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <!-- html2pdf for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .tab-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="pb-28">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-blue-400"></i>
                    에프엠엘지엘리베이터㈜
                </h1>
                <p class="text-xs text-slate-300">위험성 평가 & TBM 스마트 통합 시스템</p>
            </div>
            <div class="flex items-center gap-2">
                <div class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-user text-blue-400"></i>
                    <span id="user-display-name" class="font-medium">홍길동 과장</span>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <nav class="flex bg-slate-800 text-slate-300 text-xs border-t border-slate-700 overflow-x-auto">
            <button onclick="switchTab('tbm')" id="tab-tbm" class="tab-btn active flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-users-gear block text-sm mb-0.5"></i> 1. TBM
            </button>
            <button onclick="switchTab('kras')" id="tab-kras" class="tab-btn flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-clipboard-check block text-sm mb-0.5"></i> 2. 위험성
            </button>
            <button onclick="switchTab('export')" id="tab-export" class="tab-btn flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-file-pdf block text-sm mb-0.5"></i> 3. 보고서
            </button>
            <button onclick="switchTab('expense')" id="tab-expense" class="tab-btn flex-1 py-2 text-center min-w-[65px] transition shrink-0">
                <i class="fa-solid fa-receipt block text-sm mb-0.5 text-emerald-400"></i> 4. 경비청구
            </button>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto p-4 space-y-4">

        <!-- TAB 1: TBM -->
        <section id="sec-tbm" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-building-user text-blue-600"></i> 현장 및 TBM 정보
                </h2>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="col-span-2">
                        <label class="block text-slate-500 mb-1">현장명</label>
                        <input type="text" id="site-name" value="강남 아크로 타워 (M-01)" class="w-full border rounded p-2 bg-slate-50 font-medium">
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 2: KRAS -->
        <section id="sec-kras" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-slate-800 text-sm">KRAS 위험성 평가</h2>
            </div>
        </section>

        <!-- TAB 3: Export -->
        <section id="sec-export" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <h2 class="font-bold text-slate-800 text-base">보고서 내보내기</h2>
            </div>
        </section>

        <!-- TAB 4: 경비청구 (신규 모듈) -->
        <section id="sec-expense" class="space-y-4 hidden">
            <div class="bg-slate-900 text-white p-4 rounded-xl shadow-sm border border-slate-800 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-sm flex items-center gap-1.5 text-emerald-400">
                        <i class="fa-solid fa-receipt"></i> 개인사용비용 청구서 작성
                    </h2>
                    <p class="text-xs text-slate-300 mt-1">지출 내역을 입력하고 영수증 사진을 올려 엑셀 출력 및 증빙을 진행합니다.</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b pb-2">
                    <i class="fa-solid fa-pen-to-square text-blue-600"></i> 청구 기본 정보 및 지출 내역
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                    <div>
                        <label class="block text-slate-500 mb-1 font-bold">결의(품의)일자</label>
                        <input type="date" id="exp-claim-date" class="w-full border rounded-lg p-2 bg-slate-50 font-medium">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1 font-bold">부서명</label>
                        <input type="text" id="exp-dept" value="서비스사업부" class="w-full border rounded-lg p-2 bg-slate-50 font-medium">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1 font-bold">청구자 (직책/성명)</label>
                        <input type="text" id="exp-author" value="과장 홍길동" class="w-full border rounded-lg p-2 bg-slate-50 font-medium">
                    </div>
                </div>

                <div class="pt-2 space-y-3">
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border">
                        <span class="text-xs font-bold text-slate-800">지출 항목 입력</span>
                        <button onclick="addExpenseRow()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-plus"></i> 항목 추가
                        </button>
                    </div>

                    <div id="expense-items-container" class="space-y-3 max-h-[400px] overflow-y-auto pr-1"></div>
                </div>

                <div class="pt-3 border-t flex items-center justify-between">
                    <div class="text-xs">
                        <span class="text-slate-500 font-bold">총 지출 금액:</span>
                        <span id="exp-total-amount" class="text-base font-bold text-blue-600 ml-1">0 원</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="exportExpenseExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-file-excel"></i> 엑셀 출력
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let expenseRowCount = 0;

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            const claimInput = document.getElementById('exp-claim-date');
            if (claimInput) claimInput.value = today;
            addExpenseRow();
        });

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            const sec = document.getElementById(`sec-${tab}`);
            const btn = document.getElementById(`tab-${tab}`);
            if (sec) sec.classList.remove('hidden');
            if (btn) btn.classList.add('active');
        }

        function addExpenseRow() {
            expenseRowCount++;
            const container = document.getElementById('expense-items-container');
            if (!container) return;

            const rowId = `exp-row-${expenseRowCount}`;
            const today = new Date().toISOString().split('T')[0];

            const html = `
                <div id="${rowId}" class="p-3 bg-white border rounded-xl space-y-2 relative text-xs shadow-sm">
                    <button onclick="removeExpenseRow('${rowId}')" class="absolute top-2 right-2 text-slate-400 hover:text-rose-500 text-xs">
                        <i class="fa-solid fa-xmark"></i> 삭제
                    </button>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
                        <div>
                            <label class="block text-slate-500 mb-0.5">사용 날짜</label>
                            <input type="date" value="${today}" class="exp-item-date w-full border rounded p-1.5 bg-slate-50 font-medium">
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-0.5">증빙 서류</label>
                            <select class="exp-item-proof w-full border rounded p-1.5 bg-slate-50 font-bold">
                                <option value="현금영수증">현금영수증</option>
                                <option value="신용카드">신용카드</option>
                                <option value="체크카드">체크카드</option>
                                <option value="간이영수증">간이영수증</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-0.5">계정과목</label>
                            <select class="exp-item-account w-full border rounded p-1.5 bg-slate-50 font-bold text-blue-900">
                                <option value="운반비">운반비</option>
                                <option value="사무용품비">사무용품비</option>
                                <option value="복리후생비">복리후생비</option>
                                <option value="EL소모품비">EL소모품비</option>
                                <option value="여비교통비">여비교통비</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-0.5">지출 금액(원)</label>
                            <input type="number" oninput="calculateExpenseTotal()" placeholder="0" class="exp-item-amount w-full border rounded p-1.5 bg-slate-50 font-bold text-right text-blue-600">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div class="sm:col-span-2">
                            <label class="block text-slate-500 mb-0.5">내역 (사용 사유/거래처)</label>
                            <input type="text" placeholder="예: 화물운반비(한결상사)" class="exp-item-desc w-full border rounded p-1.5 bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-0.5">승인번호 / 비고</label>
                            <input type="text" placeholder="예: 성모#7" class="exp-item-note w-full border rounded p-1.5 bg-slate-50">
                        </div>
                    </div>

                    <div>
                        <label class="block text-slate-500 mb-0.5"><i class="fa-solid fa-camera text-blue-600"></i> 영수증 사진 촬영/첨부</label>
                        <input type="file" accept="image/*" capture="environment" class="exp-item-file text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700">
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', html);
            calculateExpenseTotal();
        }

        function removeExpenseRow(rowId) {
            const row = document.getElementById(rowId);
            if (row) row.remove();
            calculateExpenseTotal();
        }

        function calculateExpenseTotal() {
            const amountInputs = document.querySelectorAll('.exp-item-amount');
            let total = 0;
            amountInputs.forEach(input => { total += parseInt(input.value) || 0; });
            document.getElementById('exp-total-amount').textContent = total.toLocaleString() + ' 원';
        }

        function exportExpenseExcel() {
            const claimDate = document.getElementById('exp-claim-date').value;
            const author = document.getElementById('exp-author').value || '직원';
            const rows = document.querySelectorAll('#expense-items-container > div');

            if (rows.length === 0) return alert("출력할 내역이 없습니다.");

            const excelData = [];
            let totalSum = 0;

            rows.forEach((row, idx) => {
                const date = row.querySelector('.exp-item-date').value;
                const proof = row.querySelector('.exp-item-proof').value;
                const account = row.querySelector('.exp-item-account').value;
                const amount = parseInt(row.querySelector('.exp-item-amount').value) || 0;
                const desc = row.querySelector('.exp-item-desc').value;
                const note = row.querySelector('.exp-item-note').value;

                totalSum += amount;
                excelData.push({
                    "NO": idx + 1,
                    "날짜": date,
                    "증빙서류": proof,
                    "계정과목": account,
                    "내역": desc,
                    "금액": amount,
                    "승인번호/비고": note
                });
            });

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "개인사용비용청구서");

            XLSX.writeFile(workbook, `개인사용비용청구서_${author}_${claimDate}.xlsx`);
            alert(`📊 총 ${rows.length}건(${totalSum.toLocaleString()}원)의 청구 내역이 엑셀로 출력되었습니다!`);
        }
    </script>
</body>
</html>
