<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>위험성 평가 & TBM 스마트 앱 - 에프엠엘지엘리베이터㈜</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Dexie.js for Offline IndexedDB -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- Signature Pad for Touch Signatures -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <!-- html2pdf for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            try { emailjs.init("YOUR_PUBLIC_KEY"); } catch(e){}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .tab-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
        canvas.sig-pad { border: 1px dashed #9ca3af; background-color: #ffffff; border-radius: 0.375rem; touch-action: none; }
    </style>
</head>
<body class="pb-28">

    <!-- Auth & Login Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-5 border border-slate-100">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xl font-bold mx-auto shadow-md">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-base font-bold text-slate-800">에프엠엘지엘리베이터㈜</h2>
                <p class="text-xs text-slate-500">임직원 전용 위험성 평가 & TBM 시스템</p>
            </div>

            <!-- Auth Tabs -->
            <div class="flex border-b text-xs font-bold mb-3">
                <button onclick="toggleAuthMode('login')" id="auth-tab-login" class="flex-1 py-2 text-center text-blue-600 border-b-2 border-blue-600">로그인</button>
                <button onclick="toggleAuthMode('signup')" id="auth-tab-signup" class="flex-1 py-2 text-center text-slate-400 border-b-2 border-transparent">회원가입</button>
                <button onclick="toggleAuthMode('find')" id="auth-tab-find" class="flex-1 py-2 text-center text-slate-400 border-b-2 border-transparent">ID/PW 찾기</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">아이디 (이메일)</label>
                    <input type="text" id="login-id" placeholder="id@fmlg.co.kr" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="login-pw" placeholder="••••••••" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl shadow-md transition">
                    로그인
                </button>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">이름 / 직급</label>
                    <input type="text" id="signup-name" placeholder="홍길동 (기사)" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">아이디 (이메일)</label>
                    <input type="text" id="signup-id" placeholder="user@fmlg.co.kr" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="signup-pw" placeholder="••••••••" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">소속 부서 / 팀</label>
                    <input type="text" id="signup-dept" placeholder="승강기 유지관리팀" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 focus:bg-white focus:outline-none">
                </div>
                <button onclick="handleSignUp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-xl shadow-md transition">
                    가입 신청하기 (승인 대기)
                </button>
            </div>

            <!-- Find ID / Reset PW Form -->
            <div id="find-form" class="space-y-4 hidden text-xs">
                <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
                    <span class="font-bold text-slate-800 text-xs block"><i class="fa-solid fa-magnifying-glass text-blue-600"></i> 아이디 찾기</span>
                    <input type="text" id="find-id-name" placeholder="등록된 이름 (예: 홍길동)" class="w-full border rounded-lg p-2 bg-white">
                    <button onclick="handleFindId()" class="w-full bg-slate-800 text-white font-bold py-2 rounded-lg">아이디 찾기</button>
                </div>
                <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
                    <span class="font-bold text-slate-800 text-xs block"><i class="fa-solid fa-key text-amber-500"></i> 비밀번호 재설정</span>
                    <input type="text" id="find-pw-id" placeholder="아이디 (이메일)" class="w-full border rounded-lg p-2 bg-white">
                    <input type="password" id="find-pw-new" placeholder="새로운 비밀번호" class="w-full border rounded-lg p-2 bg-white">
                    <button onclick="handleResetPw()" class="w-full bg-amber-600 text-white font-bold py-2 rounded-lg">비밀번호 변경</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-blue-400"></i>
                    에프엠엘지엘리베이터㈜
                </h1>
                <p class="text-xs text-slate-300">위험성 평가 & TBM 스마트 통합 시스템</p>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="switchTab('profile')" id="header-user-badge" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-circle-user text-blue-400"></i>
                    <span id="user-display-name" class="font-medium">로그인 필요</span>
                </button>
                <button onclick="handleLogout()" title="로그아웃" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-xs p-1.5 rounded-lg border border-rose-700/50 flex items-center justify-center transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
        
        <!-- Tab Bar -->
        <nav class="flex bg-slate-800 text-slate-300 text-xs border-t border-slate-700 overflow-x-auto">
            <button onclick="switchTab('tbm')" id="tab-tbm" class="tab-btn active flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-users-gear block text-sm mb-0.5"></i> 1. TBM
            </button>
            <button onclick="switchTab('kras')" id="tab-kras" class="tab-btn flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-clipboard-check block text-sm mb-0.5"></i> 2. 위험성
            </button>
            <button onclick="switchTab('export')" id="tab-export" class="tab-btn flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-file-pdf block text-sm mb-0.5"></i> 3. 보고서
            </button>
            <button onclick="switchTab('search')" id="tab-search" class="tab-btn flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-magnifying-glass block text-sm mb-0.5"></i> 4. 이력조회
            </button>
            <button onclick="switchTab('master')" id="tab-master" class="tab-btn flex-1 py-2 text-center min-w-[65px] transition shrink-0">
                <i class="fa-solid fa-sliders block text-sm mb-0.5 text-amber-400"></i> 5. 고정항목
            </button>
            <button onclick="switchTab('admin')" id="tab-admin" class="tab-btn flex-1 py-2 text-center min-w-[65px] transition shrink-0">
                <i class="fa-solid fa-users-gear block text-sm mb-0.5 text-blue-400"></i> 6. 회원관리
            </button>
            <button onclick="switchTab('profile')" id="tab-profile" class="tab-btn flex-1 py-2 text-center min-w-[55px] transition shrink-0">
                <i class="fa-solid fa-id-card block text-sm mb-0.5"></i> 7. 내 정보
            </button>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto p-4 space-y-4">

        <!-- TAB 1: TBM 독립 공간 -->
        <section id="sec-tbm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                        <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-building-user text-blue-600"></i> TBM 전용 현장 정보
                        </h2>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="col-span-2">
                                <label class="block text-slate-500 mb-1">TBM 현장명</label>
                                <input type="text" id="tbm-site-name" value="강남 아크로 타워 (M-01)" class="w-full border rounded p-2 bg-slate-50 font-medium">
                            </div>
                            <div>
                                <label class="block text-slate-500 mb-1">작업일자</label>
                                <input type="date" id="tbm-work-date" value="2026-09-03" class="w-full border rounded p-2 bg-slate-50 font-medium">
                            </div>
                            <div>
                                <label class="block text-slate-500 mb-1">TBM 시간</label>
                                <input type="time" id="tbm-time" value="08:00" class="w-full border rounded p-2 bg-slate-50 font-medium">
                            </div>
                            <div>
                                <label class="block text-slate-500 mb-1">공종구분</label>
                                <input type="text" id="tbm-process-name" value="승강기 유지관리/부품교체" class="w-full border rounded p-2 bg-slate-50 font-medium">
                            </div>
                            <div>
                                <label class="block text-slate-500 mb-1">TBM 리더(관리감독자)</label>
                                <input type="text" id="tbm-leader" value="홍길동" class="w-full border rounded p-2 bg-slate-50 font-medium">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                        <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-users text-blue-600"></i> TBM 참석 근로자 선택 및 서명
                        </h2>
                        <div id="tbm-workers-container" class="space-y-3"></div>
                        <button onclick="addTbmWorkerCard()" class="w-full bg-slate-100 text-slate-700 py-2 rounded-lg text-xs font-bold border border-slate-200">+ TBM 참석자 추가</button>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="saveTbmDataOffline()" class="bg-slate-800 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow"><i class="fa-solid fa-floppy-disk"></i> 저장</button>
                        <button onclick="generateTbmPDF()" class="bg-blue-600 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow"><i class="fa-solid fa-file-pdf"></i> PDF 다운</button>
                        <button onclick="sendEmailReport()" class="bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow"><i class="fa-solid fa-paper-plane"></i> 이메일 제출</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 2: 위험성 평가 독립 공간 -->
        <section id="sec-kras" class="space-y-4 hidden">
            <!-- 위험성평가 독립 현장 및 평가자/근로자 서명 정보 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b pb-2">
                    <i class="fa-solid fa-clipboard-check text-amber-500"></i> 위험성 평가 개요 및 결재/확인 서명
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                    <div>
                        <label class="block text-slate-500 mb-1 font-bold">위험성평가 현장명</label>
                        <input type="text" id="risk-site-name" value="강남 아크로 타워 (M-01)" class="w-full border rounded p-2 bg-slate-50 font-bold text-slate-800">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1 font-bold">평가일자</label>
                        <input type="date" id="risk-work-date" value="2026-09-03" class="w-full border rounded p-2 bg-slate-50 font-medium">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1 font-bold">평가자 (담당자 이름)</label>
                        <input type="text" id="risk-evaluator" value="홍길동 (안전관리자)" oninput="updateEvaluatorName(this.value)" class="w-full border rounded p-2 bg-slate-50 font-bold text-blue-600">
                    </div>
                </div>

                <!-- 위험성평가 전용 참석 근로자 서명 -->
                <div class="pt-2 border-t">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-slate-700"><i class="fa-solid fa-signature text-amber-500"></i> 위험성 평가 확인 근로자 서명</label>
                        <button onclick="addRiskWorkerCard()" class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded font-bold border border-slate-200">+ 근로자 서명 추가</button>
                    </div>
                    <div id="risk-workers-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>
            </div>

            <!-- 위험요인 작성 리스트 -->
            <div class="flex justify-between items-center bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> KRAS 3x3 유해·위험요인 작성
                </h2>
                <button onclick="addAssessmentCard()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow-sm">+ 위험요인 항목 추가</button>
            </div>

            <div id="risk-card-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

            <div class="grid grid-cols-3 gap-2 pt-3 border-t">
                <button onclick="saveRiskDataOffline()" class="bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow"><i class="fa-solid fa-floppy-disk"></i> 위험성평가 저장</button>
                <button onclick="generateRiskPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow"><i class="fa-solid fa-file-pdf"></i> PDF 다운</button>
                <button onclick="sendEmailReport()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow"><i class="fa-solid fa-paper-plane"></i> 이메일 제출</button>
            </div>
        </section>

        <!-- TAB 3: 보고서 출력 및 결재란 자동 연동 -->
        <section id="sec-export" class="space-y-4 hidden">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="generateTbmPDF()" class="bg-blue-600 text-white py-3 rounded-xl font-bold text-xs shadow"><i class="fa-solid fa-file-pdf"></i> TBM 기록부 다운</button>
                <button onclick="generateRiskPDF()" class="bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs shadow"><i class="fa-solid fa-file-pdf"></i> 위험성 평가서 다운</button>
            </div>

            <!-- 미리보기 보고서 양식 (결재란 담당자 서명 연동) -->
            <div class="bg-white p-5 rounded-xl border text-xs space-y-4" id="printable-risk-area">
                <div class="flex justify-between items-start border-b-2 border-slate-800 pb-2">
                    <div>
                        <h2 class="text-base font-bold text-slate-900">에프엠엘지엘리베이터㈜ - KRAS 위험성 평가서</h2>
                        <p class="text-[10px] text-slate-500">현장명: <span id="pdf-risk-site" class="font-bold text-slate-800"></span></p>
                    </div>

                    <!-- 결재란 (담당자 서명 자동 연동) -->
                    <table class="border-collapse border border-slate-400 text-center text-[9px] w-44">
                        <tr class="bg-slate-100 font-bold">
                            <td rowspan="2" class="border border-slate-400 w-4 bg-slate-200">결<br>재</td>
                            <td class="border border-slate-400 p-0.5">담 당 (작성)</td>
                            <td class="border border-slate-400 p-0.5">승 인</td>
                        </tr>
                        <tr class="h-10">
                            <!-- 담당자 이름 및 결재 자동 서명 표시 -->
                            <td id="pdf-sign-author" class="border border-slate-400 p-1 align-middle font-bold text-blue-900 bg-blue-50/50">홍길동<br><span class="text-[8px] text-blue-600">(결재서명 연동)</span></td>
                            <td class="border border-slate-400 p-1 align-middle text-slate-300">대표이사</td>
                        </tr>
                    </table>
                </div>

                <div>
                    <span class="font-bold text-slate-700 block mb-1">■ 위험성 평가 확인 근로자 서명</span>
                    <div id="pdf-risk-worker-signs" class="flex flex-wrap gap-2 p-2 bg-slate-50 border rounded text-[10px]"></div>
                </div>

                <table class="w-full border-collapse border border-slate-300 text-[10px] text-center">
                    <thead>
                        <tr class="bg-slate-100 font-bold">
                            <th class="border border-slate-300 p-1.5">작업공정</th>
                            <th class="border border-slate-300 p-1.5">유해위험요인</th>
                            <th class="border border-slate-300 p-1.5 w-16">위험도</th>
                            <th class="border border-slate-300 p-1.5">개선대책</th>
                        </tr>
                    </thead>
                    <tbody id="pdf-risk-tbody"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const db = new Dexie('ElevatorRiskAppDB_v5');
        db.version(1).stores({
            items: '++id, step, hazard, likelihood, severity, actionPlan, photo',
            tbmWorkers: '++id, name, sigData',
            riskWorkers: '++id, name, sigData',
            reports: '++id, siteName, workDate, tbmTime, processName, tbmLeader, author, workersList, notes, createdAt'
        });

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
            if (tab === 'export') preparePdfPreview();
        }

        function updateEvaluatorName(val) {
            const authorBox = document.getElementById('pdf-sign-author');
            if (authorBox) authorBox.innerHTML = `<b>${val}</b><br><span class="text-[8px] text-blue-600">(결재서명 연동)</span>`;
        }

        /* --- TBM 근로자 서명 --- */
        async function renderTbmWorkers() {
            const container = document.getElementById('tbm-workers-container');
            if(!container) return;
            const workers = await db.tbmWorkers.toArray();
            container.innerHTML = '';
            workers.forEach(w => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="p-2 border rounded bg-slate-50 text-xs space-y-1">
                        <div class="flex justify-between items-center">
                            <input type="text" value="${w.name}" onchange="db.tbmWorkers.update(${w.id}, {name: this.value})" class="font-bold border rounded px-1.5 py-0.5">
                            <button onclick="db.tbmWorkers.delete(${w.id}); renderTbmWorkers();" class="text-rose-500 text-[10px]">삭제</button>
                        </div>
                        <canvas id="tbm-sig-${w.id}" class="sig-pad w-full h-16"></canvas>
                    </div>
                `);
            });
            setTimeout(() => {
                workers.forEach(w => {
                    const canvas = document.getElementById(`tbm-sig-${w.id}`);
                    if (canvas) {
                        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                        const pad = new SignaturePad(canvas);
                        if (w.sigData) pad.fromDataURL(w.sigData);
                        pad.onEnd = () => db.tbmWorkers.update(w.id, { sigData: pad.toDataURL() });
                    }
                });
            }, 50);
        }

        async function addTbmWorkerCard() {
            await db.tbmWorkers.add({ name: 'TBM 근로자', sigData: null });
            renderTbmWorkers();
        }

        /* --- 위험성 평가 근로자 서명 --- */
        async function renderRiskWorkers() {
            const container = document.getElementById('risk-workers-container');
            if(!container) return;
            const workers = await db.riskWorkers.toArray();
            container.innerHTML = '';
            workers.forEach(w => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="p-2 border rounded bg-slate-50 text-xs space-y-1">
                        <div class="flex justify-between items-center">
                            <input type="text" value="${w.name}" onchange="db.riskWorkers.update(${w.id}, {name: this.value})" class="font-bold border rounded px-1.5 py-0.5">
                            <button onclick="db.riskWorkers.delete(${w.id}); renderRiskWorkers();" class="text-rose-500 text-[10px]">삭제</button>
                        </div>
                        <canvas id="risk-sig-${w.id}" class="sig-pad w-full h-16"></canvas>
                    </div>
                `);
            });
            setTimeout(() => {
                workers.forEach(w => {
                    const canvas = document.getElementById(`risk-sig-${w.id}`);
                    if (canvas) {
                        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                        const pad = new SignaturePad(canvas);
                        if (w.sigData) pad.fromDataURL(w.sigData);
                        pad.onEnd = () => db.riskWorkers.update(w.id, { sigData: pad.toDataURL() });
                    }
                });
            }, 50);
        }

        async function addRiskWorkerCard() {
            await db.riskWorkers.add({ name: '평가 확인 근로자', sigData: null });
            renderRiskWorkers();
        }

        /* --- 위험성 평가 리스트 --- */
        async function renderRiskCards() {
            const container = document.getElementById('risk-card-container');
            if(!container) return;
            const items = await db.items.toArray();
            container.innerHTML = '';
            items.forEach(item => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-3.5 rounded-xl border text-xs space-y-2 shadow-sm">
                        <div class="flex justify-between font-bold">
                            <input type="text" value="${item.step}" onchange="db.items.update(${item.id}, {step: this.value})" class="border rounded p-1 w-2/3">
                            <button onclick="db.items.delete(${item.id}); renderRiskCards();" class="text-rose-500 text-[10px]">삭제</button>
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400">위험요인</label>
                            <input type="text" value="${item.hazard}" onchange="db.items.update(${item.id}, {hazard: this.value})" class="w-full border rounded p-1">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400">개선대책</label>
                            <input type="text" value="${item.actionPlan}" onchange="db.items.update(${item.id}, {actionPlan: this.value})" class="w-full border rounded p-1">
                        </div>
                    </div>
                `);
            });
        }

        async function addAssessmentCard() {
            await db.items.add({ step: '승강기 점검 작업', hazard: '감전 및 끼임 위험', likelihood: 1, severity: 2, actionPlan: '절연장갑 착용 및 수동운전' });
            renderRiskCards();
        }

        async function saveTbmDataOffline() { alert('✅ TBM 데이터가 독립 저장되었습니다!'); }
        async function saveRiskDataOffline() { alert('✅ 위험성 평가서가 독립 저장되었습니다!'); }

        /* --- PDF 미리보기 결재 서명 연동 --- */
        async function preparePdfPreview() {
            const siteName = document.getElementById('risk-site-name').value;
            const evaluator = document.getElementById('risk-evaluator').value;

            document.getElementById('pdf-risk-site').textContent = siteName;
            document.getElementById('pdf-sign-author').innerHTML = `<b>${evaluator}</b><br><span class="text-[8px] text-blue-600">(결재서명 연동)</span>`;

            const workers = await db.riskWorkers.toArray();
            const signsContainer = document.getElementById('pdf-risk-worker-signs');
            signsContainer.innerHTML = '';
            workers.forEach(w => {
                signsContainer.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center gap-1 border bg-white px-2 py-1 rounded">
                        <span><b>${w.name}:</b></span>
                        ${w.sigData ? `<img src="${w.sigData}" class="h-5">` : '<span class="text-slate-400">(서명없음)</span>'}
                    </div>
                `);
            });

            const items = await db.items.toArray();
            const tbody = document.getElementById('pdf-risk-tbody');
            tbody.innerHTML = '';
            items.forEach(item => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="border p-1 font-bold">${item.step}</td>
                        <td class="border p-1 text-left">${item.hazard}</td>
                        <td class="border p-1 font-bold bg-amber-50">중(보통)</td>
                        <td class="border p-1 text-left">${item.actionPlan}</td>
                    </tr>
                `);
            });
        }

        function generateRiskPDF() {
            const element = document.getElementById('printable-risk-area');
            html2pdf().set({ margin: 10, filename: '위험성평가서_보고서.pdf' }).from(element).save();
        }

        function generateTbmPDF() { alert('📄 TBM 일일 기록부 PDF가 다운로드됩니다.'); }
        function sendEmailReport() { alert('📧 이메일 작성 창이 연동됩니다.'); }

        window.addEventListener('DOMContentLoaded', async () => {
            if (await db.items.count() === 0) {
                await db.items.add({ step: '기계실 제어반 점검', hazard: '내부 점검 중 감전 위험', likelihood: 1, severity: 2, actionPlan: '절연장갑 착용 및 전원 확인' });
            }
            if (await db.riskWorkers.count() === 0) {
                await db.riskWorkers.add({ name: '김안전 (작업자)', sigData: null });
            }
            if (await db.tbmWorkers.count() === 0) {
                await db.tbmWorkers.add({ name: '홍길동 (리더)', sigData: null });
            }
            renderTbmWorkers();
            renderRiskWorkers();
            renderRiskCards();
            updateEvaluatorName(document.getElementById('risk-evaluator').value);
        });
    </script>
</body>
</html>
